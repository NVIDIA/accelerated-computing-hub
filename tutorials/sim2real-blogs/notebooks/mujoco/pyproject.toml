# Python dependencies for the Sim2Real MuJoCo articles (Python 3.12).
#
# Edit the dependencies here, then regenerate the lock files:
#
#   uv lock
#   uv export --frozen --no-emit-project -o requirements.lock.txt
#   (cd ../../brev && uv export --frozen --no-emit-project --project ../notebooks/mujoco --all-groups -o requirements.txt)
#
# uv.lock is the source of truth that Dependabot updates. requirements.lock.txt
# is exported from it for anyone who installs with pip, and it is what the
# notebooks and ../../README.md install:
#
#   pip install --require-hashes -r requirements.lock.txt
#
# ../../brev/requirements.txt adds the "image" group for the container image.
# Historical benchmark snapshots retain their original dependency versions.

[project]
name = "ach-sim2real-mujoco-tutorial"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    # Article 2: MuJoCo 3.17 / Warp 1.18.
    "mujoco==3.17.0",
    "mujoco-warp==3.17.0",
    "warp-lang==1.18.0",
    "numpy",
    "matplotlib",
    "nbformat",
    "nbclient",
    "ipykernel",

    # Security floor for the plotting/image dependency.
    "Pillow>=13.0.0",
]

[dependency-groups]
# Notebook UI and test tools that only the container image installs.
image = [
    "scipy",
    "ipympl",
    "jupyter-dark-detect",
    "jupyter",
    "jupyter-server-proxy",
    "jupyterlab",
    "jupyterlab-execute-time",
    "pytest",
]

[tool.uv]
package = false
