name: Tutorials

# Build each tutorial image, test it on a GPU, and only then publish its tags.
#
#   discover ─ build (per tutorial and architecture) ─ test-and-publish (per tutorial) ─ deployment-files
#
# Images are pushed to GHCR under a run-specific staging tag so the GPU runner
# can pull them. The tags people use are added only after the tests pass:
#
#   main:           latest, main-latest, main-git-<sha>
#   other branches: <branch>-latest, <branch>-git-<sha>  (e.g. pull-request-123-latest)

on:
  push:
    branches:
      - main
      - "event/**"
      - "pull-request/[0-9]+"
  schedule:
    # Nightly build at midnight EST (5 AM UTC).
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      purge_cache:
        description: "Purge Docker build cache and rebuild from scratch"
        required: false
        type: boolean
        default: false
  # pull_request is not supported for this workflow due to self-hosted runners
  # see the "Reviewing PRs from forks" section in CONTRIBUTING.md for more details

env:
  GIT_BRANCH_NAME: ${{ github.ref_name }}
  GIT_SHA: ${{ github.sha }}
  # Tutorials that CI builds, tests, and publishes. Add a tutorial here to opt
  # it in; tutorials not listed are left alone.
  CI_TUTORIALS: >-
    accelerated-python
    cuda-cpp
    nvmath-python
    warp

# Prevent an older run from replacing a newer run's branch-latest tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    outputs:
      build-matrix: ${{ steps.find-tutorials.outputs.build-matrix }}
      tutorial-matrix: ${{ steps.find-tutorials.outputs.tutorial-matrix }}
      docker-tag-branch: ${{ steps.find-tutorials.outputs.docker-tag-branch }}
      git-short-sha: ${{ steps.find-tutorials.outputs.git-short-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check CUDA base images
        run: |
          set -euo pipefail

          # Dependabot must watch exactly the tutorials CI builds.
          watched=$(grep -oP '^\s*- /tutorials/\K[^/]+(?=/docker$)' .github/dependabot.yml | sort)
          listed=$(printf '%s\n' ${CI_TUTORIALS} | sort)
          if [ "${watched}" != "${listed}" ]; then
            echo "::error::.github/dependabot.yml directories do not match CI_TUTORIALS" >&2
            diff <(echo "${listed}") <(echo "${watched}") >&2 || true
            exit 1
          fi

          # Every tutorial must build from the same CUDA version.
          for tutorial in ${CI_TUTORIALS}; do
            grep -oP '^FROM nvcr\.io/nvidia/cuda:\K[0-9.]+' "tutorials/${tutorial}/docker/dockerfile" \
              | sed "s|^|${tutorial} |"
          done | sort -u > cuda-versions.txt
          cat cuda-versions.txt
          if [ "$(cut -d' ' -f2 cuda-versions.txt | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::Tutorials use different CUDA base image versions" >&2
            exit 1
          fi
          for tutorial in ${CI_TUTORIALS}; do
            if ! grep -q "^${tutorial} " cuda-versions.txt; then
              echo "::error::tutorials/${tutorial}/docker/dockerfile does not build FROM nvcr.io/nvidia/cuda" >&2
              exit 1
            fi
          done

      - name: Find tutorials
        id: find-tutorials
        run: |
          set -euo pipefail

          build_entries=$(
            for tutorial_name in ${CI_TUTORIALS}; do
              tutorial="tutorials/${tutorial_name}"
              if [ ! -f "${tutorial}/docker/docker-compose.yml" ]; then
                echo "CI_TUTORIALS: ${tutorial}/docker/docker-compose.yml not found" >&2
                exit 1
              fi
              compose_config=$(docker compose \
                -f "${tutorial}/docker/docker-compose.yml" \
                config --format json)
              image_name=$(jq -r '."x-config".image | sub(":[^/:]+$"; "")' \
                <<< "${compose_config}")
              architectures=$(jq -c '."x-config".architectures // ["amd64"]' <<< "${compose_config}")
              large=$(jq -r '."x-config".large // false' <<< "${compose_config}")
              # Tests run on an amd64 GPU runner, so every tutorial needs amd64.
              if ! jq -e 'type == "array" and length > 0 and length == (unique | length) and all(.[]; . == "amd64" or . == "arm64") and index("amd64") != null' \
                <<< "${architectures}" > /dev/null; then
                echo "${tutorial}: architectures must be unique amd64/arm64 values and include amd64" >&2
                exit 1
              fi

              while IFS= read -r architecture; do
                case "${architecture}" in
                  amd64)
                    if [ "${large}" = "true" ]; then
                      runner=linux-amd64-cpu16
                    else
                      runner=linux-amd64-cpu4
                    fi
                    ;;
                  arm64) runner=linux-arm64-cpu16 ;;
                esac
                jq -cn \
                  --arg tutorial "${tutorial}" \
                  --arg tutorial_name "${tutorial_name}" \
                  --arg image_name "${image_name,,}" \
                  --arg architecture "${architecture}" \
                  --arg runner "${runner}" \
                  '{tutorial: $tutorial, tutorial_name: $tutorial_name,
                    image_name: $image_name, architecture: $architecture,
                    runner: $runner}'
              done < <(jq -r '.[]' <<< "${architectures}")
            done
          )
          build_matrix=$(jq -sc '{include: .}' <<< "${build_entries}")
          tutorial_matrix=$(jq -sc '
            {include: (sort_by(.tutorial) | group_by(.tutorial) | map({
              tutorial: .[0].tutorial,
              tutorial_name: .[0].tutorial_name,
              image_name: .[0].image_name,
              architectures: (map(.architecture) | join(" "))
            }))}' <<< "${build_entries}")
          docker_tag_branch=${GIT_BRANCH_NAME//[^a-zA-Z0-9._-]/-}
          docker_tag_branch=${docker_tag_branch,,}

          {
            echo "build-matrix=${build_matrix}"
            echo "tutorial-matrix=${tutorial_matrix}"
            echo "docker-tag-branch=${docker_tag_branch}"
            echo "git-short-sha=${GIT_SHA::7}"
          } >> "${GITHUB_OUTPUT}"
          echo "Build matrix: ${build_matrix}"
          echo "Tutorial matrix: ${tutorial_matrix}"

  build:
    needs: discover
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_TAG_BRANCH: ${{ needs.discover.outputs.docker-tag-branch }}
      TUTORIAL_DIR: ${{ matrix.tutorial }}
      IMAGE_NAME: ${{ matrix.image_name }}
      ARCHITECTURE: ${{ matrix.architecture }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.build-matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify native runner architecture
        run: |
          case "${ARCHITECTURE}" in
            amd64) expected=x86_64 ;;
            arm64) expected=aarch64 ;;
            *) echo "Unsupported architecture: ${ARCHITECTURE}" >&2; exit 1 ;;
          esac
          actual=$(uname -m)
          if [ "${actual}" != "${expected}" ]; then
            echo "Expected ${expected} runner for ${ARCHITECTURE}, got ${actual}" >&2
            exit 1
          fi

      - name: Check for HPCCM recipe
        run: |
          if [ -f "${TUTORIAL_DIR}/docker/docker-recipe.py" ]; then
            HAS_HPCCM=true
          else
            HAS_HPCCM=false
          fi
          echo "HAS_HPCCM=${HAS_HPCCM}" >> "${GITHUB_ENV}"

      - name: Set up Python (for HPCCM)
        if: env.HAS_HPCCM == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install HPCCM
        if: env.HAS_HPCCM == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install hpccm

      - name: Generate Dockerfile from HPCCM recipe
        if: env.HAS_HPCCM == 'true'
        run: |
          hpccm --recipe "${TUTORIAL_DIR}/docker/docker-recipe.py" --format docker > "${TUTORIAL_DIR}/docker/dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Docker build cache (nightly or manual purge)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.purge_cache)
        run: |
          echo "Purging Docker build cache to rebuild from scratch."
          docker buildx prune --all --force
          docker system prune --all --force

      - name: Build and push staging image (with retry)
        uses: nick-fields/retry@v3
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          PURGE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.purge_cache) }}
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            cd "${TUTORIAL_DIR}/docker"

            # Nightly scheduled builds and manual purge builds skip cache-from to rebuild from scratch.
            CACHE_FROM_FLAGS=()
            if [ "${PURGE}" = "true" ]; then
              echo "Purge build: skipping cache-from to rebuild from scratch."
            else
              CACHE_FROM_FLAGS=(
                --set "base.cache-from=type=registry,ref=${IMAGE_NAME}:buildcache-${DOCKER_TAG_BRANCH}-${ARCHITECTURE}"
                --set "base.cache-from=type=registry,ref=${IMAGE_NAME}:buildcache-main-${ARCHITECTURE}"
              )
              if [ "${ARCHITECTURE}" = "amd64" ]; then
                CACHE_FROM_FLAGS+=(
                  --set "base.cache-from=type=registry,ref=${IMAGE_NAME}:buildcache-${DOCKER_TAG_BRANCH}"
                  --set "base.cache-from=type=registry,ref=${IMAGE_NAME}:buildcache-main"
                )
              fi
            fi

            # The staging tag is specific to this run, so a later job can never
            # pick up an image from an earlier run, while re-running failed jobs
            # in this run can reuse architectures that already built.
            docker buildx bake \
              --progress=plain \
              --allow=fs.read=/home/runner \
              --set "base.output=type=registry" \
              --set "base.tags=${IMAGE_NAME}:staging-${GITHUB_RUN_ID}-${ARCHITECTURE}" \
              "${CACHE_FROM_FLAGS[@]}" \
              --set "base.cache-to=type=registry,ref=${IMAGE_NAME}:buildcache-${DOCKER_TAG_BRANCH}-${ARCHITECTURE},mode=max,image-manifest=true,compression=zstd,compression-level=3" \
              --set "base.platform=linux/${ARCHITECTURE}" \
              -f docker-compose.yml \
              base

      - name: Check disk space after build
        if: always()
        run: |
          df -h /
          du -sh /var/lib/docker/* 2>/dev/null || true
          du -sh /var/lib/buildkit/* 2>/dev/null || true

  test-and-publish:
    needs:
      - discover
      - build
    # Test and publish each tutorial whose images built, even if another
    # tutorial failed. A missing staging image fails only that tutorial.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    name: test-and-publish (${{ matrix.tutorial_name }})
    runs-on: linux-amd64-gpu-l4-latest-1
    timeout-minutes: 120
    env:
      BUILDKIT_PROGRESS: plain
      DOCKER_CLI_HINTS: false
      DOCKER_TAG_BRANCH: ${{ needs.discover.outputs.docker-tag-branch }}
      GIT_SHORT_SHA: ${{ needs.discover.outputs.git-short-sha }}
      TUTORIAL_NAME: ${{ matrix.tutorial_name }}
      IMAGE_NAME: ${{ matrix.image_name }}
      ARCHITECTURES: ${{ matrix.architectures }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.tutorial-matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop DCGM to allow NCU profiling
        run: |
          # DCGM (Data Center GPU Manager) locks the GPU and prevents NCU from
          # profiling. Stop it before running the container tests.
          docker rm -f dcgm-exporter 2>/dev/null || true
          for service in dcgm-exporter nvidia-dcgm dcgm nv-hostengine; do
            sudo systemctl stop "${service}" 2>/dev/null || true
          done
          sudo pkill -9 nv-hostengine || true
          sudo pkill -9 dcgm || true

          # Relax profiling permissions (perf_event_paranoid=4 is very restrictive).
          sudo sysctl -w kernel.perf_event_paranoid=2 || true
          sudo sysctl -w kernel.kptr_restrict=0 || true

          nvidia-smi

      - name: Generate Docker Compose file for the staging image
        run: |
          python3 brev/generate-tagged-docker-composes.py \
            --image-tag "staging-${GITHUB_RUN_ID}-amd64" \
            --output-dir artifacts/staging \
            --tutorial "${TUTORIAL_NAME}" \
            --type base

      - name: Pull staging image
        run: |
          COMPOSE_FILE="artifacts/staging/${TUTORIAL_NAME}/docker/docker-compose.yml"
          mapfile -t IMAGES < <(docker compose -f "${COMPOSE_FILE}" config --images | sort -u)
          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo "No service images found in ${COMPOSE_FILE}" >&2
            exit 1
          fi
          for IMAGE in "${IMAGES[@]}"; do
            docker pull "${IMAGE}"
          done

      - name: Test
        run: |
          ./brev/test-docker-compose.bash "artifacts/staging/${TUTORIAL_NAME}/docker/docker-compose.yml"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish image tags
        run: |
          set -euo pipefail

          verify_platforms() {
            local image=$1
            local platforms
            platforms=$(docker manifest inspect --verbose "${image}" | \
              jq -r '(if type == "array" then .[] else . end) | .Descriptor.platform | select(. != null and .os != null and .architecture != null) | select(.os != "unknown" and .architecture != "unknown") | "\(.os)/\(.architecture)"' | \
              sort -u)
            if [ "${platforms}" != "${EXPECTED_PLATFORMS}" ]; then
              echo "Unexpected platforms in ${image}:" >&2
              echo "${platforms}" >&2
              echo "Expected:" >&2
              echo "${EXPECTED_PLATFORMS}" >&2
              exit 1
            fi
          }

          TAGS=(
            "${IMAGE_NAME}:${DOCKER_TAG_BRANCH}-git-${GIT_SHORT_SHA}"
            "${IMAGE_NAME}:${DOCKER_TAG_BRANCH}-latest"
          )
          if [ "${GIT_BRANCH_NAME}" = "main" ]; then
            TAGS+=("${IMAGE_NAME}:latest")
          fi

          SOURCES=()
          EXPECTED_PLATFORMS=""
          for architecture in ${ARCHITECTURES}; do
            SOURCES+=("${IMAGE_NAME}:staging-${GITHUB_RUN_ID}-${architecture}")
            EXPECTED_PLATFORMS+="linux/${architecture}"$'\n'
          done
          EXPECTED_PLATFORMS=$(printf '%s' "${EXPECTED_PLATFORMS}" | sort -u)

          TAG_FLAGS=()
          for tag in "${TAGS[@]}"; do
            TAG_FLAGS+=(--tag "${tag}")
          done
          docker buildx imagetools create "${TAG_FLAGS[@]}" "${SOURCES[@]}"

          for tag in "${TAGS[@]}"; do
            verify_platforms "${tag}"
            echo "Published ${tag}"
          done

      - name: Generate deployment Docker Compose files
        run: |
          python3 brev/generate-tagged-docker-composes.py \
            --image-tag "${DOCKER_TAG_BRANCH}-latest" \
            --output-dir artifacts/branch-latest \
            --tutorial "${TUTORIAL_NAME}" \
            --type all

      - name: Generate CSCS EDF
        run: |
          brev/generate-cscs-edf.bash \
            --output "artifacts/branch-latest/${TUTORIAL_NAME}/docker/cscs.toml" \
            "artifacts/branch-latest/${TUTORIAL_NAME}/docker/docker-compose.yml"

      - name: Upload deployment Docker Compose files
        uses: actions/upload-artifact@v4
        with:
          name: branch-latest-deployment-${{ env.TUTORIAL_NAME }}
          path: artifacts/branch-latest/
          retention-days: 30
          overwrite: true

  deployment-files:
    needs:
      - discover
      - test-and-publish
    # Publish deployment files for tutorials that passed even when another
    # tutorial failed.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment Docker Compose files
        uses: actions/download-artifact@v4
        with:
          pattern: branch-latest-deployment-*
          path: artifacts/branch-latest
          merge-multiple: true

      - name: Push deployment Docker Compose files to the generated branch
        run: |
          set -euo pipefail

          shopt -s nullglob
          tutorial_dirs=(artifacts/branch-latest/*)
          if [ "${#tutorial_dirs[@]}" -eq 0 ]; then
            echo "No tutorials passed, so there are no deployment files to publish" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin generated:generated
          git checkout generated
          mkdir -p "${GIT_BRANCH_NAME}/tutorials"

          for tutorial_dir in "${tutorial_dirs[@]}"; do
            tutorial_name=$(basename "${tutorial_dir}")
            target_dir="${GIT_BRANCH_NAME}/tutorials/${tutorial_name}"
            rm -rf "${target_dir}"
            cp -r "${tutorial_dir}" "${GIT_BRANCH_NAME}/tutorials/"
            git add --all "${target_dir}"
          done

          # PyHPC is now a course inside accelerated-python. Remove deployment
          # files from the former standalone tutorial when publishing either
          # this event branch or main after the PR merges.
          if [ -d "artifacts/branch-latest/accelerated-python" ]; then
            git rm -r --ignore-unmatch \
              "${GIT_BRANCH_NAME}/tutorials/pyhpc"
          fi

          if git diff --staged --quiet; then
            echo "No deployment changes to commit"
            exit 0
          fi

          git commit -m "Update deployment files for ${GIT_BRANCH_NAME}"

          max_attempts=10
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if git push origin generated; then
              echo "Pushed to the generated branch"
              exit 0
            fi

            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "Failed to push the generated branch after ${attempt} attempts" >&2
              exit 1
            fi

            # Runs for different branches can finish together. Back off before
            # rebasing so they do not retry in lockstep.
            delay=$((attempt + RANDOM % (attempt + 3)))
            echo "Push failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s"
            sleep "${delay}"
            git pull --rebase origin generated
          done
